[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-assistant"
version = "3.3.0"
description = "A multi-user, multi-model AI assistant with accounts, advanced tools, a web app and a CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "starlette>=0.37",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["numpy", "pandas", "matplotlib"]  # makes the code interpreter much more useful

[project.scripts]
nimbus = "nimbus.cli:main"

[tool.setuptools.packages.find]
include = ["nimbus*"]

[tool.setuptools.package-data]
nimbus = ["static/*", "static/vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
