# fly launch --no-deploy --copy-config   then:  fly volumes create nimbus_data --size 1
app = "nimbus-CHANGE-ME"
primary_region = "ams"

[build]

[env]
  NIMBUS_DATA_DIR = "/data"
  NIMBUS_HOST = "0.0.0.0"
  NIMBUS_PORT = "8000"

[mounts]
  source = "nimbus_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # keep running so scheduled tasks fire
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
