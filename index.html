<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080a0f"
  >

  <title>NOVA AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================
       AUTH SCREEN
  ====================================== -->

  <div class="auth-screen" id="authScreen">

    <div class="auth-card">

      <div class="auth-logo">
        ✦
      </div>

      <h1>NOVA</h1>

      <p class="auth-subtitle">
        Your intelligent workspace.
      </p>

      <form id="authForm">

        <div class="auth-field">
          <label>Email</label>

          <input
            id="authEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="auth-field">
          <label>Password</label>

          <input
            id="authPassword"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <div
          class="auth-name-field"
          id="authNameField"
        >
          <label>Name</label>

          <input
            id="authName"
            type="text"
            placeholder="Your name"
            autocomplete="name"
          >
        </div>

        <button
          class="auth-submit"
          id="authSubmit"
          type="submit"
        >
          Continue
        </button>

      </form>

      <p
        class="auth-message"
        id="authMessage"
      ></p>

      <button
        class="auth-switch"
        id="authSwitch"
        type="button"
      >
        Create an account
      </button>

    </div>

  </div>


  <!-- =====================================
       SIDEBAR
  ====================================== -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-top">

      <div class="brand">

        <div class="brand-icon">
          ✦
        </div>

        <div>
          <strong>NOVA</strong>
          <span>AI WORKSPACE</span>
        </div>

      </div>

      <button
        class="new-chat-btn"
        id="newChatBtn"
      >
        <span>＋</span>
        <span>New chat</span>
      </button>

    </div>


    <div class="conversation-section">

      <p class="sidebar-label">
        RECENT
      </p>

      <div id="conversationList"></div>

      <div
        class="empty-conversations"
        id="emptyConversations"
      >
        No conversations yet
      </div>

    </div>


    <div class="sidebar-bottom">

      <button
        class="sidebar-btn"
        id="settingsBtn"
      >
        <span>⚙</span>
        <span>Settings</span>
      </button>

      <button
        class="sidebar-btn"
        id="helpBtn"
      >
        <span>?</span>
        <span>Help</span>
      </button>

      <button
        class="sidebar-btn logout-btn"
        id="logoutBtn"
      >
        <span>↪</span>
        <span>Log out</span>
      </button>

    </div>

  </aside>


  <!-- =====================================
       MAIN APPLICATION
  ====================================== -->

  <main class="app">

    <!-- TOP BAR -->

    <header class="topbar">

      <button
        class="menu-btn"
        id="menuBtn"
        aria-label="Open menu"
      >
        ☰
      </button>

      <div class="mobile-brand">
        <span>✦</span>
        NOVA
      </div>

      <div class="model-label">
        NOVA AI
      </div>

      <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Toggle theme"
        title="Toggle theme"
      >
        ☾
      </button>

    </header>


    <!-- =====================================
         CHAT AREA
    ====================================== -->

    <section
      class="chat-container"
      id="chatContainer"
    >

      <!-- WELCOME -->

      <div
        class="welcome-screen"
        id="welcomeScreen"
      >

        <div class="nova-orb">
          <span>✦</span>
        </div>

        <div class="welcome-eyebrow">
          YOUR AI WORKSPACE
        </div>

        <h1>
          What are we building today?
        </h1>

        <p>
          Ask NOVA anything. Learn, create, analyze,
          code, plan, or explore an idea.
        </p>


        <div class="starter-grid">

          <button
            class="starter-card"
            data-prompt="Explain something to me simply"
          >
            <div class="starter-icon">◈</div>

            <div>
              <strong>Explain</strong>
              <small>Make complex ideas simple</small>
            </div>
          </button>


          <button
            class="starter-card"
            data-prompt="Help me write some code"
          >
            <div class="starter-icon">{ }</div>

            <div>
              <strong>Code</strong>
              <small>Build or fix a program</small>
            </div>
          </button>


          <button
            class="starter-card"
            data-prompt="Help me analyze a problem"
          >
            <div class="starter-icon">⌁</div>

            <div>
              <strong>Analyze</strong>
              <small>Break down a problem</small>
            </div>
          </button>


          <button
            class="starter-card"
            data-prompt="Help me create a plan"
          >
            <div class="starter-icon">◇</div>

            <div>
              <strong>Plan</strong>
              <small>Turn an idea into steps</small>
            </div>
          </button>

        </div>

      </div>


      <!-- MESSAGES -->

      <div
        class="messages"
        id="messages"
      ></div>

    </section>


    <!-- =====================================
         COMPOSER
    ====================================== -->

    <section class="composer-area">

      <div class="composer">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message NOVA..."
          autocomplete="off"
        ></textarea>

        <button
          id="sendBtn"
          class="send-btn"
          aria-label="Send message"
        >
          ↑
        </button>

      </div>

      <p class="composer-note">
        NOVA can make mistakes. Check important information.
      </p>

    </section>

  </main>


  <!-- =====================================
       MOBILE OVERLAY
  ====================================== -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>


  <!-- =====================================
       MODAL
  ====================================== -->

  <div
    class="modal-overlay"
    id="modalOverlay"
  >

    <div class="modal">

      <button
        class="modal-close"
        id="modalClose"
      >
        ×
      </button>

      <div id="modalContent"></div>

    </div>

  </div>


  <!-- =====================================
       SUPABASE
  ====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="nova/tools.js"></script>
<script src="script.js"></script>
  <!-- NOVA -->

  <script src="script.js"></script>

</body>
</html>
